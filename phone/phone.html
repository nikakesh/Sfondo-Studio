<div class="mockup-wrapper">
    
    <!-- Hidden State Inputs -->
    <input type="radio" id="mode-lock" name="screen-mode" class="state-input" checked>
    <input type="radio" id="mode-home" name="screen-mode" class="state-input">

    <!-- Screen Mode Toggle -->
    <div class="screen-mode-toggle">
      <label for="mode-lock" class="mode-label">Lock Screen</label>
      <label for="mode-home" class="mode-label">Home Pair</label>
    </div>

    <!-- iPhone Shell -->
    <div class="iphone-frame">
      <div class="dynamic-island"></div>
      
      <!-- Wallpaper Image -->
      <img class="wallpaper-display" src="./3.png" alt="Wallpaper" />

      <!-- Lock Screen View -->
      <div class="lockscreen-content">
        <div class="lockscreen-date">Sun, 15 Nov</div>
        <div class="lockscreen-time">09:41</div>
      </div>

      <!-- Home Screen View -->
      <div class="homescreen-content">
        <div class="home-widget widget-large"></div>
        <div class="widget-row">
          <div class="home-widget widget-small"></div>
          <div class="home-widget widget-small"></div>
        </div>
      </div>

    </div>

  </div>
